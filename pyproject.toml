[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskwitness"
version = "0.0.1"
description = "Evidence-first, human-controlled computer operator (assessment prototype)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.9",
  "playwright>=1.48,<2",
  "openai>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["taskwitness*", "demo_env*"]

[tool.setuptools.package-data]
demo_env = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
